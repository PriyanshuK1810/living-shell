# --- notifications / bell ------------------------------------------------
# No audio bell (prompt: prefer none or a very subtle visual cue); the
# visual bell is off too — attention comes from tab activity and the
# Living State Island, which is the surface that already reports state.
enable_audio_bell   no
visual_bell_duration 0.0

# Long-running command completion. `invisible` = the window is unfocused
# AND not visible, so a notification only fires when you genuinely cannot
# see the result; the island announces the same event as a transient state
# when the terminal is in view (avoiding two surfaces shouting at once).
# Requires shell_integration (bash marks), which is enabled above.
notify_on_cmd_finish invisible 8.0 notify
