# --- keybindings ---------------------------------------------------------
# Structure (prompt): ONE leader + group letters, never random hotkeys.
#   leader  = Ctrl+Shift+Space   (chain prefix)
#   groups  = s splits, w panes, t tabs, p project, f files, h hints,
#             o opacity, l layouts, c palette, b broadcast, g git
#
# A lone leader press is a no-op: kitty's map_timeout is 0, so chains do
# not wait. The palette is therefore ALSO on kitty's default Ctrl+Shift+F3.
#
# kitty defaults kept as-is (documented, not remapped):
#   Ctrl+Shift+C/V  copy/paste          Ctrl+Shift+Enter new window
#   Ctrl+Shift+T    new tab             Ctrl+Shift+W/Q  close window/tab
#   Ctrl+Shift+/    search scrollback   Ctrl+Shift+Z/X  prev/next prompt
#   Ctrl+Shift+H    show scrollback     Ctrl+Shift+G    last command output
#   Ctrl+Shift+E    url hints           Ctrl+Shift+P>…  choose file/dir
#   Ctrl+Shift+A>…  opacity             Ctrl+Shift+[ ]  prev/next window
#   Ctrl+Shift+←/→  prev/next tab       Ctrl+Shift+1..0 jump to window
#   Alt+T           set tab title       Ctrl+Shift+R    interactive resize
#   Ctrl+Shift+F10/F11 maximize/fullscreen
# Hyprland binds Super+<key> only (hyprland.lua), so nothing here can be
# swallowed by the compositor.

# --- discovery -----------------------------------------------------------
map ctrl+shift+space>c command_palette

# --- splits (leader s) ---------------------------------------------------
map ctrl+shift+space>s>s new_window
map ctrl+shift+space>s>v new_window !vsplit
map ctrl+shift+space>s>h new_window !hsplit
map ctrl+shift+space>s>c close_window

# --- panes (leader w): focus on hjkl, resize on arrows -------------------
map ctrl+shift+space>w>h neighboring_window left
map ctrl+shift+space>w>l neighboring_window right
map ctrl+shift+space>w>k neighboring_window top
map ctrl+shift+space>w>j neighboring_window bottom
map ctrl+shift+space>w>left  resize_window narrower 2
map ctrl+shift+space>w>right resize_window wider 2
map ctrl+shift+space>w>up    resize_window shorter 2
map ctrl+shift+space>w>down  resize_window taller 2
map ctrl+shift+space>w>e layout_action equalize
map ctrl+shift+space>w>m toggle_layout stack
map ctrl+shift+space>w>r reset_window_sizes

# --- tabs (leader t) -----------------------------------------------------
map ctrl+shift+space>t>n next_tab
map ctrl+shift+space>t>p previous_tab
map ctrl+shift+space>t>c new_tab
map ctrl+shift+space>t>q close_tab

# --- project / session (leader p) ---------------------------------------
# Full multi-tab sessions are launched from the shell:
#   kproject            (fzf chooser over sessions/*.conf)
#   kitty --session ~/.config/kitty/sessions/development.conf
# The leader+p keys only open project-oriented tabs in the current dir.
map ctrl+shift+space>p>n new_tab_with_cwd nvim
map ctrl+shift+space>p>t new_tab_with_cwd
map ctrl+shift+space>p>s set_tab_title

# --- file chooser (leader f) --------------------------------------------
map ctrl+shift+space>f>c kitten choose-files
map ctrl+shift+space>f>d kitten choose-files --mode=dir

# --- hints (leader h) ----------------------------------------------------
map ctrl+shift+space>h>u kitten hints --type url
map ctrl+shift+space>h>p kitten hints --type path --program -
map ctrl+shift+space>h>e kitten hints --type path --program "launch --type=tab nvim"
map ctrl+shift+space>h>l kitten hints --type line --program -
map ctrl+shift+space>h>f kitten hints --type linenum
# Note the --hold on git show: a bare `launch --type=tab git show`
# closes again the instant git exits, so the highlighted commit would
# flash by unreadable.
map ctrl+shift+space>h>c kitten hints --type hash --program "launch --hold --type=tab git show"
map ctrl+shift+space>h>w kitten hints --type word --program @
map ctrl+shift+space>h>i kitten hints --type ip --program @

# --- opacity / readability (leader o) -----------------------------------
# (arrows, not +/- keys: kitty's key parser treats a bare "+" as a
# modifier separator, so +/- here would silently fail to bind)
map ctrl+shift+space>o>up   set_background_opacity +0.05
map ctrl+shift+space>o>down set_background_opacity -0.05
map ctrl+shift+space>o>0    set_background_opacity default
# Readability mode: opaque background + maximum text contrast in this
# window. Restoring glass mode returns both. Limitation: kitty only
# changes custom_shaders at config load, so the inactive-pane dim shader
# cannot be switched off at runtime (documented in docs/kitty.md).
map ctrl+shift+space>o>r combine : set_background_opacity 1 : set_colors foreground=white background=black
map ctrl+shift+space>o>g combine : set_background_opacity default : set_colors foreground=#F0E8E1 background=#0A0810

# --- layouts (leader l) --------------------------------------------------
map ctrl+shift+space>l>t goto_layout tall
map ctrl+shift+space>l>s goto_layout splits
map ctrl+shift+space>l>k goto_layout stack
map ctrl+shift+space>l>n next_layout

# --- broadcast (leader b) ------------------------------------------------
# Takes over input and echoes it to every kitty window in this instance;
# the kitten draws its own banner so the active state is visible.
map ctrl+shift+space>b kitten broadcast

# --- git utilities (leader g) -------------------------------------------
# lazygit (the only optional member of this group) lives in
# conf.d/95-tools.conf so that dropping one file disables it.
# The two read-only views use `launch --hold`: without it the command
# finishes in milliseconds and kitty closes the tab it just opened, so
# the output is gone before it can be read (verified at runtime — this
# is why these are launch actions rather than new_tab_with_cwd).
# --cwd=current keeps the tab in the directory the user is working in.
map ctrl+shift+space>g>l launch --hold --type=tab --cwd=current -- git log --oneline -30
map ctrl+shift+space>g>s launch --hold --type=tab --cwd=current -- git status --short --branch
