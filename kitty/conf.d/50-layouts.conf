# --- layouts -------------------------------------------------------------
# kitty 0.49.2 ships: tall, splits, stack, grid, vertical (layout dir has
# no "fat" layout, so it is omitted rather than invented).
# Order matters: the first entry is the startup layout.
enabled_layouts tall,splits,stack

# Split bias: give the focused (editor) pane the larger share when a tab
# splits, which matches the reference layout: big pane left, stack right.
# (Per-split sizes are still adjustable with leader+w resize and equalize.)
