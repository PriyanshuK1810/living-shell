# --- tabs ----------------------------------------------------------------
# Custom tab bar: tabs/tab_bar.py draws slanted, Waybar-like tabs with a
# role icon per tab (project-aware titles) and colour accents for SSH/root.
# Built-in alternatives (fade/slant/separator/powerline) were rejected
# because none of them can colour a tab by role.
tab_bar_style      custom
tab_bar_edge       top
# no gap above the bar (it sits under the Void Shell Waybar), a small
# breathing space between bar and pane contents.
tab_bar_margin_height 0 4
tab_bar_min_tabs       1
tab_bar_align          left

# Compact titles: shell integration already puts cwd/cmd in {title};
# tab_bar.py prefixes the icon and truncates.
tab_title_template        '{title}'
active_tab_title_template '{title}'
tab_title_max_length      32

# Activity and bells are drawn by tab_bar.py (single amber dot, no emoji).
tab_activity_symbol ''
bell_on_tab        ''
