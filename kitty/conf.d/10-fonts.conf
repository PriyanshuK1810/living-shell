# --- fonts ---------------------------------------------------------------
# Only one Nerd Font is actually installed on this machine:
#   fc-match "Maple Mono NF"      -> FreeMono      (absent)
#   fc-match "CaskaydiaCove Nerd Font" -> FreeSans (absent)
#   fc-match "JetBrainsMono Nerd Font" -> JetBrainsMono Nerd Font (present)
# So JetBrainsMono NF is used everywhere; Maple/Caskaydia/FiraCode are
# documented as unavailable rather than silently substituted.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Scale 1.5 on eDP-1 (1920x1080 -> 1280x720 logical): 12pt reads as
# roughly 16px logical, close to the bar's UI text.
font_size 12.0

# Ligatures stay on (->, =>, ==) — they are part of the terminal look the
# design reference shows — but disabled inside the cursor so block cursor
# placement stays predictable in editors.
disable_ligatures cursor

# Emoji/Nerd Font fallback for glyphs JetBrainsMono NF lacks: nothing
# extra to add, the Nerd Font patch already covers  icode points.
