# --- integrations --------------------------------------------------------
# Hyperlinks and URL detection (hints + open-actions route them).
allow_hyperlinks yes
detect_urls       yes
url_style         curly

# Clipboard: selections never auto-copy; writes go to clipboard and
# primary, reads ask first (kitty's defaults, spelled out so the policy
# is explicit rather than inherited).
copy_on_select    no
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# --- local remote control (no TCP, no password in a file) ----------------
# socket-only : control is possible ONLY over the socket below; control
#               via the tty (SSH sessions, other local terminals) is
#               refused outright.
# listen_on    : a per-process UNIX socket inside XDG_RUNTIME_DIR, which
#               the session owns with mode 0700. Same-user processes only,
#               no filesystem path outside the runtime dir, no port.
#               {kitty_pid} keeps a second kitty from stealing the name.
# Children inherit KITTY_LISTEN_ON, so scripts (and the watcher below)
# can address *their* kitty with `kitten @` without any secret.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# --- watcher -------------------------------------------------------------
# watchers/desktop_state.py observes command start/end and title changes
# and republishes classified state to the Living State Island through the
# existing voidshell JobBridge IPC (qs -c voidshell ipc call job ...).
# It never blocks: every report is a detached, argument-only subprocess.
watcher watchers/desktop_state.py

# The command palette / open URL path is also wired in open-actions.conf
# (read by kitten open, not by kitty.conf itself).
