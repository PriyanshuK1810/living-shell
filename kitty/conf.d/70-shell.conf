# --- shell integration / scrollback --------------------------------------
# Login shell on this machine is bash 5.3 (zsh is NOT installed and was
# not added). kitty's bash integration gives prompt marks, cwd titles and
# command tracking — the same capabilities the prompt attributed to zsh.
# Documented as an intentional deviation in docs/kitty.md.
shell_integration enabled

editor  nvim
# Keep the default pager: less is present, bat is optional and never a
# hard dependency (the scrollback pager is a safety net, not a viewer).
scrollback_lines 10000
scrollback_pager less -R +G
# Bounded secondary history so a long session cannot grow without limit.
scrollback_pager_history_size 64
