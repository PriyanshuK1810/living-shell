# --- optional external tools --------------------------------------------
# This file is listed last in kitty.conf's index on purpose: everything
# in it depends on a program that may not exist on the machine, and
# deleting this one file is the supported way to turn those off without
# touching the rest of the config (kitty.conf globs conf.d/*.conf).
#
# Installed on this machine and verified at runtime:
#   lazygit   -> leader g > g (below)
#   bat, fd   -> command-line tools; no kitty option consumes them, so
#                they are deliberately NOT wired into kitty.conf. They
#                are on PATH for the shell and for scripts/kproject,
#                which uses fd when present and falls back to find.
#   eza       -> same: a shell tool, never aliased over ls here, because
#                the config must launch a terminal on a machine where
#                eza is absent (hard dependencies are not allowed).
#
# git log / git status / git show stay in conf.d/60-keymaps.conf: git
# itself is always present, so those are not optional.

# lazygit runs in a tab in the current repository's directory.
map ctrl+shift+space>g>g new_tab_with_cwd lazygit
