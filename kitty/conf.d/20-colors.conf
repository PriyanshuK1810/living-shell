# --- colors (sampled from Void Shell bar, dark mode) ---------------------
# Bar tokens used as the source of truth:
#   bgRoot #0A0810  bgDeep #0E0B14  bgElevated #15111D
#   textPrimary #F0E8E1  textSecondary #D6CCD8  textMuted #A89CAF
#   accent.primary #8B4DFF  accent.light #B487FF  accent.strong #6A2DE2
#   success #39CFA0  warning #EABD59  danger #FF5B73  info #7F8DFF
#   gold #B99A66 (ink-wash)  cyan #67E8F9 (informational)
# No invented purples: every value below is a bar token or a close
# functional neighbour of one (bright variants for readability).

background           #0A0810
foreground           #F0E8E1

# Cursor: accent.light so it is findable without shouting.
cursor               #B487FF
cursor_text_color    #0A0810

selection_background #3A2A5F
selection_foreground #F0E8E1

url_color            #67E8F9

# ANSI 0-7 (base)
color0  #15111D
color1  #FF5B73
color2  #39CFA0
color3  #EABD59
color4  #7F8DFF
color5  #B487FF
color6  #67E8F9
color7  #D6CCD8

# ANSI 8-15 (bright)
color8  #746B7D
color9  #FF8FA3
color10 #5FE0B4
color11 #F6C177
color12 #9FB4FF
color13 #C9A7FF
color14 #A9F0FF
color15 #EEEAF6

# Pane borders (drawn only when a tab has more than one pane).
# active matches Hyprland's active_border rgb(6E3ACF) so pane and window
# outlines read as one system; inactive is a nearly invisible dark violet.
window_border_width     1px
active_border_color     #6E3ACF
inactive_border_color   #2A2440

# Search/selection marks: plum family from the bar support tones.
mark1_background #4A2E8C
mark1_foreground #EEEAF6
mark2_background #56346C
mark2_foreground #EEEAF6
mark3_background #302747
mark3_foreground #EEEAF6

# Tab bar strip (the custom tab_bar.py below draws on top of these).
tab_bar_background      #0C0912
active_tab_background   #2A1A4D
active_tab_foreground   #EEEAF6
inactive_tab_background #0E0B14
inactive_tab_foreground #A89CAF
active_tab_font_style   bold
inactive_tab_font_style normal

# 256-colour indexes are left at kitty's `palette_generate` default
# (fixed): switching to semantic/legacy re-maps colour meanings, and this
# terminal is used with tools that assume standard xterm semantics.
# All 16 base colours above are set explicitly, so apps that speak the
# 16/256 palette stay on-palette.
