# --- window / glass ------------------------------------------------------
# Alpha is kitty's job; the blur is Hyprland's (decoration.blur is already
# enabled, size 6). kitty's Wayland background_blur request is not
# implemented by Hyprland, so keeping it at 0 avoids a dead option.
background_opacity          0.91
dynamic_background_opacity  yes
background_blur             0

# Small inner padding so text is not glued to the pane edge (design
# reference: quiet margins). Values are vertical horizontal.
window_padding_width 8 10

# Hyprland draws the outer window: 2px violet border, rounding 12, gaps
# 4/8 from hyprland.lua. Hide kitty's own titlebar so nothing doubles up
# and no fake macOS traffic lights exist anywhere.
# kitty's own Wayland titlebar colour option only matters with CSD
# titlebars (GNOME-style); decorations are hidden here, so it is unset
# rather than given a value that would do nothing.
hide_window_decorations yes

# Sizing: remember per-class geometry, place new OS windows centred (the
# tiler re-homes them anyway, this matters for float/fallback cases).
remember_window_size  yes
placement_strategy     center

# --- cursor ---------------------------------------------------------------
cursor_shape        block
cursor_blink_interval 0.6
# Trail (native option, no shader compiler needed):
#  * cursor_trail = how long the cursor must sit still before a jump is
#    eligible for a trail -> plain typing (cursor moves every keypress)
#    never trails.
#  * start threshold in cells: a single-cell step is ignored, so wrapping
#    lines, Neovim navigation and history jumps do trail.
cursor_trail                200
cursor_trail_start_threshold 3 2
cursor_trail_decay           0.1 0.4
cursor_trail_color           #7C3AED

# --- shaders (needs shader-slang -> slangc) ------------------------------
# A Slang pipeline compiles once at config load (there is no runtime
# toggle for custom_shaders, documented in docs/kitty.md): inactive split
# panes are dimmed by 14% towards the ink background so the focused pane
# reads as focused without any glow or border. The pipeline lives in
# shaders/dim-inactive-panes.pipeline and is static — it only redraws when
# focus or content changes, so it costs nothing per frame.
# If slangc is missing, kitty logs one clear error and runs unshaded.
custom_shaders              dim-inactive-panes

# --- chrome restraint -----------------------------------------------------
mouse_hide_wait             3.0
focus_follows_mouse         no
strip_trailing_spaces       smart
