# --- kitten quick-access-terminal (Super+grave in hyprland.lua) -----------
# A layer-shell panel, not a window: Hyprland draws no decoration for it,
# kitty draws the glass, and the layer rule in hyprland.lua adds blur.
#
# Geometry, in the monitor's *logical* pixels (eDP-1 is 1920x1080 at
# scale 1.5 -> 1280x720 logical):
#   width  896  = 70% of 1280   (brief: 68-74%)
#   height 288  = 40% of  720   (brief: 36-42%)
#   top     80  = sits below the Void Shell bar (bar bottom is y=66) + 14
#   centred via equal left/right margins (1280-896)/2 = 192
lines   288px
columns 896px
edge    top
margin_top 80
margin_left 192
margin_right 192
margin_bottom 0

# Glass: slightly thinner than the main terminal because this surface
# floats over wallpaper content.
background_opacity 0.87

# Pressing the binding again while it is open hides it; losing focus also
# hides it (brief asked for this only if it proves stable — it is tested
# in docs/testing.md).
hide_on_focus_loss yes
focus_policy       on-demand
grab_keyboard       no
