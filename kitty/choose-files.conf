# --- kitten choose-files (leader+f>c / +d, kitty's Ctrl+Shift+P>…) -------
# Previews are on: this is the surface that replaces a full-blown file
# manager for quick picks. Syntax colouring ships inside kitty's own
# highlighter, so the chooser colours previews on this machine with
# nothing extra installed (verified: it needs no pygments).
show_preview        yes
dark_pygments_style github-dark
video_preview       width=480 fps=10 duration=5
show_hidden         no
respect_ignores     yes
cache_size          0.5
