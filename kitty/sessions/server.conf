# Living Kitty — server / ops session
#
# Three working shells in a splits grid plus a socket watch, so a
# deployment or investigation has room without opening more tabs.
#
# Remote hosts are NOT wired in here on purpose: this machine has no
# openssh client installed (verified: `command -v ssh` is empty), so a
# hardcoded `ssh somehost` line would be a broken feature. Use the
# `kssh <host>` helper instead — it reports the missing dependency
# rather than failing silently — and add real hosts to this file once
# openssh is installed.
title ops
layout splits
launch
launch
launch watch -n 3 "ss -tulpn | head -8"

new_tab logs
cd /
launch watch -n 5 "uptime; free -h | sed -n 1,2p"
