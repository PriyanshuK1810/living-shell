# Living Kitty — default session
#
# One tab, one window, the startup layout from conf.d/50-layouts.conf
# (`tall`, which is a no-op for a single pane). This is what plain
# `kitty` gives you anyway; it exists so `kproject` always has a
# baseline to compare against.
#
# Session files may ONLY contain session commands (new_tab, layout,
# cd, title, launch, ...). kitty rejects kitty.conf options here — that
# is why fonts/colours live in conf.d/ and not in this file.
title shell
layout tall
