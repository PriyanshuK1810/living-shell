# Living Kitty — development session (the arrangement from the brief)
#
#   ┌───────────────┬───────────────────────┐
#   │               │  shell                │
#   │     nvim      ├───────────────────────┤
#   │               │  logs (git history)   │
#   └───────────────┴───────────────────────┘
#
# `layout tall` puts the main window in a left column and stacks the
# others in a right column, which is exactly that diagram. Split sizes
# are adjustable afterwards with Ctrl+Shift+Space w <arrow> and w e
# (equalize) / w r (reset).
#
# Nothing here is invented: nvim, watch and git are all present, and
# the only path used is $HOME/dotfiles (expands from the environment,
# no hardcoded user name).
title code
layout tall
launch nvim
launch
launch watch -n 5 git -C $HOME/dotfiles log --oneline -8

# Second tab: the config repository in splits.
new_tab repo
layout splits
cd ~/dotfiles
launch
launch --hold git status --short --branch
