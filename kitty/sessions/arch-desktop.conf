# Living Kitty — Arch desktop session
#
# For working on this machine's own configuration:
#   tab "shell"  : interactive shell + a live machine watch (splits)
#   tab "shellrc": the Void Shell repository in nvim
#   tab "hypr"   : hyprland.lua itself, open at its real path
#
# Every command below exists on this box (nvim, watch, free, df, git);
# nothing is assumed to be installed later.
title shell
layout splits
launch
launch watch -n 5 "uptime; free -h | sed -n 1,2p; df -h / | tail -1"

new_tab shellrc
cd ~/.config/quickshell/voidshell
launch nvim

new_tab hypr
cd ~/dotfiles
launch nvim hypr/.config/hypr/hyprland.lua
