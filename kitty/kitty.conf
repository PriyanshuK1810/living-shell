# VOID SHELL — ink-glass kitty (Arch + Hyprland + Quickshell)
#
# Design language is sampled from the Void Shell bar (dark mode "Void
# Wallpaper" tokens in services/ThemeService.qml and common/Colors.qml):
# ink-black translucent surfaces, violet accents, small gold/cyan/green
# functional accents, parchment text, no RGB/gradient decoration.
#
# Structure: this file only wires features in. Every feature lives in
# conf.d/ so it can be disabled by dropping one file:
#
#   conf.d/10-fonts.conf        fonts + glyph coverage
#   conf.d/20-colors.conf       ink/violet palette (sampled from the bar)
#   conf.d/30-window.conf       glass, cursor, borders, shaders
#   conf.d/40-tabs.conf         compact slanted tabs + tab_bar.py
#   conf.d/50-layouts.conf      splits/tall/stack
#   conf.d/60-keymaps.conf      leader hierarchy (Ctrl+Shift+Space)
#   conf.d/70-shell.conf        shell integration, scrollback, editor
#   conf.d/80-notifications.conf bell + long-command notifications
#   conf.d/90-integrations.conf local socket, watcher, hyperlinks
#   conf.d/95-tools.conf        optional external tools (lazygit, ...)
#
# Read separately by other kitty entry points (NOT included here, each
# parses its own syntax):
#   open-actions.conf           kitten open / URL routing
#   quick-access-terminal.conf  kitten quick-access-terminal
#   choose-files.conf           kitten choose-files (preview settings)
#   sessions/*.conf             startup session layouts
#
# Validation used during setup (kitty 0.49.2 has no --debug-config CLI
# flag; the debug_config action only exists inside a running kitty):
#   PYTHONPATH=/usr/lib/kitty python3 scripts/validate-config.py

globinclude conf.d/*.conf
