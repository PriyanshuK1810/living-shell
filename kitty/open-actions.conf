# --- open-actions.conf ---------------------------------------------------
# Read when a terminal hyperlink is clicked (Ctrl+Shift+click), by
# `kitten open` and by `kitty +open`. Its syntax is NOT kitty.conf's —
# entries are `criteria` lines plus one or more `action` lines, separated
# by blank lines — which is why kitty.conf does not `include` this file.
#
# Correct criteria keys (kitty 0.49.2 open_actions.py): protocol, url,
# fragment_matches, mime, ext, file, path. An earlier draft of this file
# used `match type ...`, which this version of kitty silently ignores —
# validate with scripts/validate-config.py, which now catches that.
#
# Policy: nothing is executed from here. Text opens read-only in the
# editor, images render inline, everything else goes to the desktop
# opener. A click on a link must never run a program by itself.

# Images: preview inline over the current window (icat ships with kitty;
# ImageMagick is only needed for its thumbnailing features).
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- $FILE_PATH

# Text, source, logs, JSON: read-only in the configured editor, in a new
# tab. Read-only (`nvim -R`) so a stray click cannot modify a file; the
# tab closes when the editor exits.
protocol file
mime text/*,application/json,application/xml,application/javascript,application/x-sh,inode/x-empty
action launch --type=tab nvim -R -- $FILE_PATH

# Directories: open a shell there instead of trying to "preview" them.
protocol file
mime inode/directory
action launch --type=tab --cwd -- $FILE_PATH

# Fallback: PDFs, archives, audio/video, unknown types — the desktop
# opener owns them (xdg-open -> Hyprland/portal).
protocol file
mime *
action launch --type=os-window -- xdg-open -- $FILE_PATH

# ssh:// links route through the bundled helper, which prints a real
# dependency message on this machine (openssh is not installed) instead
# of failing silently.
protocol ssh
action launch --hold --type=os-window -- $HOME/.config/kitty/scripts/kssh -- $URL
